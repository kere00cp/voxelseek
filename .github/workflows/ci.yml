name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy 在 Linux 上要链接 ALSA 和 udev，缺了 cargo check 会挂在 alsa-sys
      - name: System deps (Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      # 暂时只报告、不拦门：这份代码还有一批 dead_code/unused，
      # 等清干净了再把 -D warnings 打开。
      - name: Clippy (advisory)
        run: cargo clippy --workspace --all-targets -- -W clippy::all
        continue-on-error: true

      - name: Test
        run: cargo test --workspace
